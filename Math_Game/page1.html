<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <title>Math Quiz</title>
</head>
<body id="bodyLevel">
    <div id="level">
        <button class="show-modal" id="easy1"> Level 1</button>
        <button class="show-modal" id="easy2"> Level 2</button>
        <button class="show-modal" id="easy3"> Level 3</button>
        <button class="show-modal" id="medium4"> Level 4</button>
        <button class="show-modal" id="medium5"> Level 5</button>
        <button class="show-modal" id="medium6"> Level 6</button>
        <button class="show-modal" id="hard7"> Level 7</button>
        <button class="show-modal" id="hard8"> Level 8</button>
        <button class="show-modal" id="hard9"> Level 9</button>
        <button class="show-modal" id="expert10"> Level 10</button>
        <button class="show-modal" id="expert11"> Level 11</button>
        <button class="show-modal" id="expert12"> Level 12</button>
    </div>

    <div class="modal hidden">
        <h1>Math Question</h1>
        <p id="size" class="theQuestion">1+1</p>
        <input id="num" type="number" placeholder="Your answer">
        <button id="okay-button">Okay</button>
    </div>

    <div class="overlay hidden"></div>

    <script src="index.js"></script>
</body>
</html>
