<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form Website</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="parent">
     
<form id="loginForm" class="parent" aria-label="Login Form">
  <h1>Login</h1>
  <div class="input">
    <input type="text" id="email" placeholder="Email" aria-label="Email" required>
    <i class="fas fa-envelope"></i>
  </div>
  <div class="input">
    <input type="password" id="password" placeholder="Password" aria-label="Password" required>
    <i class="fas fa-lock"></i>
  </div>
  <div class="remember-forget">
    <label>
      <input type="checkbox" id="rememberMe" aria-label="Remember Me"> Remember Me
    </label>
    <a href="#" aria-label="Forgot Password">Forgot Password?</a>
  </div>
  <button type="submit" class="btn">Login</button>
  <div class="register">
    <p>Don't have an account? <a href="register.html" aria-label="Register">Register</a></p>
  </div>
</form>

<!-- Registration Form -->
<form id="registerForm" class="parent" aria-label="Registration Form">
  <h1>Register</h1>
  <div class="input">
    <input type="text" id="firstName" placeholder="First Name" aria-label="First Name" required>
    <i class="fas fa-user"></i>
  </div>
  <div class="input">
    <input type="text" id="lastName" placeholder="Last Name" aria-label="Last Name" required>
    <i class="fas fa-user"></i>
  </div>
  <div class="input">
    <input type="tel" id="phone" placeholder="Phone Number" aria-label="Phone Number" required>
    <i class="fas fa-phone"></i>
  </div>
  <div class="input">
    <input type="email" id="email" placeholder="Email" aria-label="Email" required>
    <i class="fas fa-envelope"></i>
  </div>
  <div class="input">
    <input type="password" id="password" placeholder="Password" aria-label="Password" required>
    <i class="fas fa-lock"></i>
  </div>
  <button type="submit" class="btn">Create Account</button>
</form>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
  </body>
</html>
